[package]
name = "sonam-server"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"

[dependencies]
axum = { version = "0.8", features = ["multipart"] }
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["fs", "limit"] }
rusqlite = { version = "0.38", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
argon2 = "0.5"
rand = "0.8"
sha2 = "0.10"
hex = "0.4"
rust-embed = { version = "8", features = ["debug-embed"] }
mime_guess = "2"
if-addrs = "0.15"
futures-core = "0.3"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif"] }
kamadak-exif = "0.6"
dav-server = { version = "0.11", default-features = false, features = ["localfs"] }
mdns-sd = "0.21"
base64 = "0.22"
http-body-util = "0.1"
# Optional Google Drive backup (HTTPS client, bundled roots so phones/containers need no system store).
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls-webpki-roots"] }
md-5 = "0.10"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"

[profile.dev]
debug = 0
incremental = false

[profile.test]
debug = 0
incremental = false
