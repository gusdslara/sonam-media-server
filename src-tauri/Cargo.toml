[package]
name = "sonam"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"

[lib]
name = "sonam_app"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
sonam-server = { path = "../server" }
tokio = { version = "1", features = ["full"] }

[profile.dev]
debug = 0
incremental = false
