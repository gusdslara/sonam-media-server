# Projeto XcodeGen do cliente iOS do Sonam.
# O .xcodeproj NÃO é versionado: gere com `xcodegen generate` (feito pelo workflow .github/workflows/ios.yml).
name: Sonam
options:
  bundleIdPrefix: org.sonam
  deploymentTarget:
    iOS: "15.0"
  developmentLanguage: pt-BR
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
targets:
  Sonam:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: Sonam
    settings:
      base:
        PRODUCT_NAME: Sonam
        PRODUCT_BUNDLE_IDENTIFIER: org.sonam.ios
        INFOPLIST_FILE: Support/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: "NO"
        ENABLE_BITCODE: "NO"
        DEVELOPMENT_TEAM: ""
schemes:
  Sonam:
    build:
      targets:
        Sonam: all
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
