[package]
name = "sonam-android"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
publish = false

[lib]
name = "sonam_android"
crate-type = ["cdylib"]

[dependencies]
sonam-server = { path = "../../../server" }
jni = "0.21"
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time"] }

[profile.release]
opt-level = 2
debug = 0
strip = true
codegen-units = 16
incremental = false
